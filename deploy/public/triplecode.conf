limit_req_zone $binary_remote_addr zone=triplecode_auth_per_ip:10m rate=12r/m;

server {
    listen 80;
    server_name triplecode.ru;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://triplecode.ru$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name triplecode.ru;
    ssl_certificate /etc/letsencrypt/live/triplecode.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/triplecode.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream triplecode-production-web-1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;

    location ~ ^/auth/(code|verify)/?$ {
        limit_req zone=triplecode_auth_per_ip burst=8 nodelay;
        limit_req_status 429;
        proxy_pass http://$upstream;
    }

    location / {
        proxy_pass http://$upstream;
    }
}
