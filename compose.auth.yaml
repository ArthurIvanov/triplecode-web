services:
  web:
    environment:
      SUPABASE_URL: http://auth-gateway:8080
  auth-db:
    image: supabase/postgres:17.6.1.136
    environment:
      POSTGRES_PASSWORD: "${AUTH_DB_PASSWORD:?}"
      POSTGRES_DB: postgres
    volumes:
      - auth-data-v2:/var/lib/postgresql/data
      - ./deploy/lan/auth-roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-triplecode-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  auth:
    image: supabase/gotrue:v2.197.0
    depends_on:
      auth-db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: "${APP_ORIGIN:?}"
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: "postgres://supabase_auth_admin:${AUTH_DB_PASSWORD:?}@auth-db:5432/postgres?search_path=auth"
      GOTRUE_SITE_URL: "${APP_ORIGIN:?}"
      GOTRUE_DISABLE_SIGNUP: 'false'
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_MAILER_AUTOCONFIRM: 'false'
      GOTRUE_JWT_SECRET: "${AUTH_JWT_SECRET:?}"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_MAILER_OTP_LENGTH: '6'
      GOTRUE_MAILER_OTP_EXP: '600'
      GOTRUE_SMTP_ADMIN_EMAIL: noreply@example.test
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: '1025'
      GOTRUE_SMTP_MAX_FREQUENCY: 60s
      GOTRUE_SMTP_SENDER_NAME: TripleCode
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: Код входа в TripleCode
      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: Код входа в TripleCode
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://auth-gateway:8080/templates/email-code.html
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: http://auth-gateway:8080/templates/email-code.html
    restart: unless-stopped
  auth-gateway:
    image: nginx:1.28.0-alpine
    depends_on:
      auth:
        condition: service_started
        restart: true
    volumes:
      - ./deploy/lan/auth-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/api/supabase/templates:/usr/share/nginx/html/templates:ro
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.27.10
    ports:
      - "127.0.0.1:54324:8025"
    restart: unless-stopped
volumes:
  auth-data-v2:
