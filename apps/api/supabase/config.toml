project_id = "triplecode-web"

[api]
port = 54321

[db]
port = 54322

[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 600

[auth.email.template.confirmation]
subject = "Код входа в TripleCode"
content_path = "./supabase/templates/email-code.html"

[auth.email.template.magic_link]
subject = "Код входа в TripleCode"
content_path = "./supabase/templates/email-code.html"
